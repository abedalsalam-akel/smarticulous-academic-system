name: Java source compilation

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile application sources
        run: |
          mkdir -p build/ci-classes
          find src/main/java -name '*.java' -print0 | xargs -0 javac -Xlint:all -d build/ci-classes
      - name: Clarify test status
        run: echo "Compilation only. University JUnit tests require unavailable course-specific DBUtil dependency."
